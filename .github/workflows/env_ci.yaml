name: Python CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
          architecture: x64
      
      - name: Install dependencies
        run: |
          pip install uv
          uv add --requirements requirements.txt
          uv sync
      
      - name: Create .env file
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> src/income_tax/.env
          echo "PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}" >> src/income_tax/.env

      - name: Run tests
        run: |
          source .venv/bin/activate
          timeout 120 streamlit run src/income_tax/app.py
          