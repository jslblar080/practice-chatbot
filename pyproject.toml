[project]
name = "practice-chatbot"
version = "0.1.0"
description = "Personal Chatbot Project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.84.0",
    "docx2txt>=0.9",
    "langchain>=0.2.17",
    "langchain-chroma>=0.2.2",
    "langchain-community>=0.2.19",
    "langchain-ollama>=0.1.3",
    "langchain-openai>=0.1.25",
    "langchain-pinecone>=0.1.3",
    "langchain-text-splitters>=0.2.4",
    "langchain-upstage>=0.1.7",
    "numpy>=1.26.4",
    "openai>=1.109.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.1",
    "streamlit>=1.54.0",
    "tokenizers>=0.21",
]

[tool.uv]
package = true

[project.scripts]
income-tax-test-utils = "income_tax.cli:CLI.test_utils"
income-tax-convert-docx-img-to-md = "income_tax.cli:CLI.convert_docx_img_to_md"
income-tax-main = "income_tax.cli:CLI.main"

[project.urls]
Repository = "https://github.com/jslblar080/practice-chatbot"

[tool.setuptools.packages.find]
where = ["src"]
